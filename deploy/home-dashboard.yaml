# Home dashboard: nginx (Angular app + API proxies) and the reddit/uptime sidecar in one pod.
#
# Not in git, created by hand once (and again whenever they change):
#   kubectl -n home-dashboard create secret generic home-dashboard-secrets --from-env-file=app/.env   # WAQI_TOKEN, JELLYFIN_TOKEN, SONARR_API_KEY, RADARR_API_KEY, FIREFLY_TOKEN, SPARKY_API_KEY
#   kubectl -n home-dashboard create configmap home-dashboard-config --from-file=config.json=app/public/config.json \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n home-dashboard rollout restart deploy/home-dashboard   # subPath mounts don't pick up ConfigMap edits
# The ConfigMap is only the seed: on first start the sidecar copies it to the Longhorn PVC, and from then on the
# dashboard's edit mode saves there. To re-seed from the ConfigMap: kubectl exec ... -c sidecar -- rm /data/config.json, then restart.
#
# Images are built and pushed to ghcr.io by .github/workflows/images.yml when a v* tag is pushed.
apiVersion: v1
kind: Namespace
metadata:
  name: home-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-dashboard
  namespace: home-dashboard
  labels: { app: home-dashboard }
spec:
  replicas: 1
  strategy: { type: Recreate } # RWO volume: the old pod must let go before the new one mounts it
  selector:
    matchLabels: { app: home-dashboard }
  template:
    metadata:
      labels: { app: home-dashboard }
    spec:
      containers:
        - name: nginx
          image: ghcr.io/krionist/home-dashboard:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 80 }]
          env:
            - name: HA_UPSTREAM # camera snapshots are proxied (and cached) through nginx
              value: http://192.168.1.7:8123
          envFrom:
            - secretRef: { name: home-dashboard-secrets } # WAQI_TOKEN, JELLYFIN_TOKEN, SONARR_API_KEY, RADARR_API_KEY, FIREFLY_TOKEN → nginx templates
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        - name: sidecar # reddit JSON, /up checks and config.json read/save on 127.0.0.1:8082, reached only via nginx
          image: ghcr.io/krionist/home-dashboard-sidecar:latest
          imagePullPolicy: Always
          env:
            - name: HA_URL # PUT /config.json is allowed only with a token HA accepts
              value: http://192.168.1.7:8123
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /seed, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 192Mi }
      volumes:
        - name: config
          configMap: { name: home-dashboard-config }
        - name: data
          persistentVolumeClaim: { claimName: home-dashboard-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-dashboard-data
  namespace: home-dashboard
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests: { storage: 100Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: home-dashboard
  namespace: home-dashboard
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.244 # fixed so a dashboard.lan DNS record can point at it
spec:
  type: LoadBalancer
  selector: { app: home-dashboard }
  ports: [{ name: http, port: 80, targetPort: http }]
