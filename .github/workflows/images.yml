# Build both images when a version tag (v1.2.3) is pushed and publish them to GitHub Container Registry:
#   ghcr.io/krionist/home-dashboard          (nginx + Angular app, repo root Dockerfile)
#   ghcr.io/krionist/home-dashboard-sidecar  (reddit / uptime helper, sidecar/Dockerfile)
# Tags: the git tag (e.g. v1.2.3) + latest. Release: git tag v1.2.3 && git push origin v1.2.3
name: images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: home-dashboard, context: . }
          - { image: home-dashboard-sidecar, context: sidecar }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64 # the cluster's Talos nodes are all amd64
          tags: |
            ghcr.io/krionist/${{ matrix.image }}:latest
            ghcr.io/krionist/${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
